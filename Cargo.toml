[package]
name = "skopos"
version = "0.1.0-prototype"
edition = "2024"
rust-version = "1.85"
description = "Observed context acquisition for grounded software agents"
license = "MIT"
repository = "https://github.com/agent-grounds/skopos"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
